
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#09050f">
    <meta name="description" content="MoonLab — Impressão 3D e peças personalizadas em Nova Iguaçu, RJ. Solicite seu orçamento.">

    <title>MoonLab | Impressão 3D</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #09050f;
            color: #ffffff;
            font-family: 'Space Grotesk', sans-serif;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        .universe {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
            background:
                radial-gradient(ellipse at 50% 0%,
                #5e0bb0 0%,
                #210b40 35%,
                #09050f 75%);
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 4s infinite alternate;
        }

        @keyframes twinkle {
            from { opacity: 0.15; }
            to { opacity: 0.85; }
        }

        .orbit {
            position: absolute;
            width: 480px;
            height: 480px;
            border: 1px solid rgba(180, 120, 255, 0.13);
            border-radius: 50%;
            top: -140px;
            left: 50%;
            transform: translateX(-50%);
        }

        main {
            width: 100%;
            max-width: 480px;
            padding: 65px 25px 40px;
            text-align: center;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            animation: appear 1s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            width: 125px;
            height: 125px;
            margin: 0 auto 30px;
            border-radius: 50%;
            background: #0a0a0e;
            border: 1px solid #7845b6;
            box-shadow: 0 0 45px #7929c850;
            display: grid;
            place-items: center;
            overflow: hidden;
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .placeholder {
            font-size: 65px;
        }

        .tag {
            display: inline-block;
            margin: 0 auto 20px;
            padding: 7px 14px;
            border: 1px solid #a36be655;
            border-radius: 30px;
            color: #d3b5ff;
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(30px, 8vw, 45px);
            font-weight: 700;
            letter-spacing: 4px;
            margin-bottom: 20px;
        }

        .slogan {
            font-size: 19px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .description {
            color: #c5b8d7;
            font-size: 15px;
            line-height: 1.7;
        }

        .location {
            color: #a98ad4;
            font-size: 13px;
            margin-top: 15px;
        }

        .cta {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 35px;
            padding: 20px 15px;
            border-radius: 14px;
            background: #ffffff;
            color: #590db3;
            font-size: 17px;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 0 35px #7929c840;
            transition: 0.3s;
        }

        .cta:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 45px #a34cff70;
        }

        a:focus-visible {
            outline: 3px solid #d3b5ff;
            outline-offset: 5px;
        }

        .support {
            font-size: 12px;
            color: #a89ab9;
            margin-top: 13px;
        }

        .socials {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 28px;
        }

        .socials a {
            width: 46px;
            height: 46px;
            border-radius: 12px;
            border: 1px solid #b48aef40;
            background: #ffffff08;
            color: white;
            display: grid;
            place-items: center;
            transition: 0.3s;
        }

        .socials a:hover {
            background: #6a18b8;
        }

        svg {
            width: 23px;
            height: 23px;
        }

        footer {
            width: 100%;
            text-align: center;
            padding: 25px 15px;
            color: #8f819e;
            font-size: 11px;
        }

        footer a {
            color: #c7a7f7;
            text-decoration: none;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <div class="universe" id="universe">
        <div class="orbit"></div>
    </div>

    <main>

        <div class="logo">
            <img src="logo.png"
                 alt="Logotipo MoonLab"
                 onerror="this.hidden=true; document.getElementById('placeholder').hidden=false;">
            <span class="placeholder" id="placeholder" hidden>🌙</span>
        </div>

        <div class="tag">
            Criatividade sem limites
        </div>

        <h1>MOONLAB</h1>

        <p class="slogan">
            Suas ideias em uma nova dimensão.
        </p>

        <p class="description">
            Impressão 3D e peças personalizadas.
            <br>
            Transformamos suas ideias em realidade.
        </p>

        <p class="location">
            Nova Iguaçu — RJ
        </p>

        <a class="cta"
           href="https://wa.me/5521991411906?text=Ol%C3%A1%21%20Gostaria%20de%20solicitar%20um%20or%C3%A7amento%20de%20impress%C3%A3o%203D."
           target="_blank"
           rel="noopener noreferrer">

            Solicite seu orçamento
            <span aria-hidden="true">↗</span>

        </a>

        <p class="support">
            Atendimento personalizado pelo WhatsApp.
        </p>

        <div class="socials">

            <a href="https://www.instagram.com/moon_lab.3d/"
               target="_blank"
               rel="noopener noreferrer"
               aria-label="Instagram da MoonLab">

                <svg viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="1.8">
                    <rect x="3" y="3" width="18"
                          height="18" rx="5"/>
                    <circle cx="12" cy="12" r="4"/>
                    <circle cx="17.5" cy="6.5" r="1"
                            fill="currentColor"/>
                </svg>

            </a>

            <a href="https://wa.me/5521991411906"
               target="_blank"
               rel="noopener noreferrer"
               aria-label="WhatsApp da MoonLab">

                <svg viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="1.8">
                    <path d="M20.5 11.5a8.5 8.5 0 0 1-12.8 7.3L3 20l1.3-4.5A8.5 8.5 0 1 1 20.5 11.5Z"/>
                    <path d="M8 7c-2 3 3 9 6 9l2-2-3-2-1 1-3-3 1-1-2-2Z"/>
                </svg>

            </a>

        </div>

    </main>

    <footer>
        Desenvolvido por
        <a href="https://www.instagram.com/its.studiobloom/"
           target="_blank"
           rel="noopener noreferrer">
            Bloom Studio
        </a>
        © 2026
    </footer>

    <script>
        const universe = document.getElementById('universe');

        for (let i = 0; i < 75; i++) {
            const star = document.createElement('span');
            star.className = 'star';

            const size = Math.random() * 2 + 0.5;

            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 5 + 's';

            universe.appendChild(star);
        }
    </script>

</body>
</html>
